# Koyeb service definitions. Two services (web + worker), both on the free
# instance type. Env vars are declared as secrets so Koyeb never round-trips
# them through git.
#
# Deploy via:
#   koyeb app init vinsend --git-branch main
#   koyeb service create --from-file koyeb.yaml
# ...or import via the web console (Create App → Import from koyeb.yaml).

services:
  - name: web
    type: web
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    health_checks:
      - grpc: null
        http:
          path: /api/health
          port: 3000
    instance_type: free
    regions:
      - fra   # Frankfurt. Swap to `was` (Washington) or `sin` (Singapore).
    scaling:
      min: 1
      max: 1
    git:
      repository: github.com/Vinay1812007/VinSEND
      branch: main
      builder: docker
      docker:
        dockerfile: Dockerfile
    env:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://vinsend-web-<your-handle>.koyeb.app
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://vinsend-web-<your-handle>.koyeb.app
      - key: WEBHOOK_USER_AGENT
        value: VinSEND-Webhooks/1.0
      - key: LOG_LEVEL
        value: info
      - key: WORKER_RUN_CRON
        value: "false"   # web instance does NOT run the cron loop
      - { key: NEXT_PUBLIC_SUPABASE_URL,      secret: vinsend_supabase_url }
      - { key: NEXT_PUBLIC_SUPABASE_ANON_KEY, secret: vinsend_supabase_anon }
      - { key: SUPABASE_SERVICE_ROLE_KEY,     secret: vinsend_supabase_service }
      - { key: SECRET_ENCRYPTION_KEY,         secret: vinsend_encryption_key }
      - { key: API_KEY_PEPPER,                secret: vinsend_api_key_pepper }

  - name: worker
    type: worker
    instance_type: free
    regions:
      - fra
    scaling:
      min: 1
      max: 1
    git:
      repository: github.com/Vinay1812007/VinSEND
      branch: main
      builder: docker
      docker:
        dockerfile: Dockerfile
        command: ["node", "-r", "tsx/cjs", "scripts/worker.ts"]
    env:
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_USER_AGENT
        value: VinSEND-Webhooks/1.0
      - key: LOG_LEVEL
        value: info
      - key: WORKER_RUN_CRON
        value: "true"    # this instance runs sweep + nightly jobs
      - key: NEXT_PUBLIC_APP_URL
        value: https://vinsend-web-<your-handle>.koyeb.app
      - { key: NEXT_PUBLIC_SUPABASE_URL,      secret: vinsend_supabase_url }
      - { key: NEXT_PUBLIC_SUPABASE_ANON_KEY, secret: vinsend_supabase_anon }
      - { key: SUPABASE_SERVICE_ROLE_KEY,     secret: vinsend_supabase_service }
      - { key: SECRET_ENCRYPTION_KEY,         secret: vinsend_encryption_key }
      - { key: API_KEY_PEPPER,                secret: vinsend_api_key_pepper }
