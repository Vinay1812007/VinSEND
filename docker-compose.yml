## Local dev only. For production, deploy the built image against your own
## managed Postgres (Supabase, RDS, etc). This compose file gives you a
## disposable Postgres + MailHog so you can develop against `http://localhost:3000`.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: vinsend
      POSTGRES_DB: vinsend
    ports:
      - "54322:5432"
    volumes:
      - vinsend_pg:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - mailhog
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    command: ["node", "-r", "tsx/cjs", "scripts/worker.ts"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}

volumes:
  vinsend_pg:
